name: Daily POS Sales Email Report

on:
  schedule:
    # 12:00 UTC = 21:00 KST (오후 9시 한국시간)
    - cron: '0 12 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [send_report_now]

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run POS Report and Send Email
        env:
          POS_USER: ${{ secrets.POS_USER }}
          POS_PASS: ${{ secrets.POS_PASS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          CUTOFF_DATE: ${{ secrets.CUTOFF_DATE }}
        run: |
          python pos_report.py
